# Street Gym for iPhone: checks on every push, on GitHub's runners.
#
# This file belongs in the standalone repository (justdataplease/streetgym) as .github/workflows/ios-ci.yml. That
# repository is public, so its macOS minutes are free; the private suite repository would be billed for them.
# There this project is the ios/ folder, beside app/ (Android) and shared/ (the engine).
name: iOS
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/res/**'
      - '.github/workflows/ios-ci.yml'
    # An ios-v* tag (ios-v2.15.0) uploads the app to App Store Connect (the testflight job); v* tags are Android's releases.
    # GitHub doesn't apply the paths filter to tags.
    tags: ['ios-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The engine and the screens as plain Kotlin, the tests, and a PNG of every screen. No Mac needed.
  screens:
    name: Tests and screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4, as the Android checks use (v6.4.0 restored a cache that hid downloads)
        with:
          validate-wrappers: true
          dependency-graph: disabled
      - name: Shared code is plain Kotlin, tests, screenshots
        run: >-
          bash ./gradlew :shared:compileCommonMainKotlinMetadata :composeApp:compileCommonMainKotlinMetadata
          :composeApp:desktopTest :composeApp:screenshots --no-daemon --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        # The pictures are a convenience: a full artifact store (private repos have a quota) must not fail the checks.
        continue-on-error: true
        with:
          name: screens-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ios/composeApp/build/screenshots/
            ios/composeApp/build/reports/tests/

  # The real thing: Kotlin compiled for iPhone, the app built by Xcode, opened in the Simulator and photographed.
  simulator:
    name: iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4, as the Android checks use (v6.4.0 restored a cache that hid downloads)
        with:
          validate-wrappers: true
          dependency-graph: disabled
      # The Kotlin/Native compiler and Apple's platform libraries: about 1 GB, downloaded once.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/build.gradle.kts') }}
      - name: Compile the engine and the screens for iPhone, run the tests there
        working-directory: ios
        run: sh ./gradlew :shared:compileKotlinIosSimulatorArm64 :composeApp:iosSimulatorArm64Test --console=plain
      - name: Generate the Xcode project
        working-directory: ios/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the app and tour it in the Simulator
        working-directory: ios/iosApp
        run: |
          set -euo pipefail
          # The newest large iPhone this Xcode has.
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+ Pro Max' | sort -t' ' -k2 -n | tail -1)
          echo "Simulator: $DEVICE"
          xcodebuild test -project StreetGym.xcodeproj -scheme StreetGym \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/tour.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Take the pictures out of the test result
        if: always()
        run: xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tour.xcresult" --output-path "$RUNNER_TEMP/tour"
      # What the app itself printed (Kotlin's uncaught errors, Compose's and Metal's complaints): the only place they show.
      - name: Print what the app wrote while it ran
        if: always()
        run: |
          xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/tour.xcresult" --output-path "$RUNNER_TEMP/diagnostics" || true
          # The app's own file, without the test runner's talk about every label it reads.
          find "$RUNNER_TEMP/diagnostics" -type f -name 'StandardOutputAndStandardError-*' 2>/dev/null | while read -r f; do
            echo "APP-OUTPUT-BEGIN"
            grep -v -E '\[Default\]|XC_kAX|^\}|^$' "$f" | tail -n 120 || true
            echo "APP-OUTPUT-END"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        # The pictures are a convenience: a full artifact store (private repos have a quota) must not fail the checks.
        continue-on-error: true
        with:
          name: simulator-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/tour/

  # The release: on an ios-v* tag, after the Simulator tour passes, GitHub's Mac signs the app with the owner's App Store
  # Connect API key (Xcode's automatic signing, cloud-managed certificate) and uploads it to App Store Connect, where it
  # appears in TestFlight. Written on the owner's Mac on 28 Nov 2026; it runs once the Apple account exists. Needs, in the
  # repository's settings (environment "app-store"):
  #   secrets  ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text; the key's role must be Admin, which lets
  #            Xcode make the distribution certificate and profiles), GOOGLE_SERVICE_INFO_PLIST (the Firebase iPhone app's
  #            GoogleService-Info.plist, base64)
  #   vars     APPLE_TEAM_ID, ADMOB_APP_ID, ADMOB_NATIVE_ID, ADMOB_INTERSTITIAL_ID (the owner's iPhone AdMob app and units)
  # It refuses to upload with Google's test ad ids or without Firebase: test ads must never reach the App Store.
  testflight:
    name: Upload to App Store Connect
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: [screens, simulator]
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4, as the other jobs
        with:
          validate-wrappers: true
          dependency-graph: disabled
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/build.gradle.kts') }}
      - name: Check the tag, the ad ids and Firebase
        env:
          TAG: ${{ github.ref_name }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_NATIVE_ID: ${{ vars.ADMOB_NATIVE_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^\s+MARKETING_VERSION:' ios/iosApp/project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          [ "$TAG" = "ios-v$VERSION" ] || { echo "The tag $TAG doesn't match MARKETING_VERSION $VERSION"; exit 1; }
          for id in "$ADMOB_APP_ID" "$ADMOB_NATIVE_ID" "$ADMOB_INTERSTITIAL_ID"; do
            case "$id" in ""|*3940256099942544*) echo "Set the owner's iPhone AdMob ids in the repository variables"; exit 1;; esac
          done
          [ -n "$TEAM" ] || { echo "Set APPLE_TEAM_ID"; exit 1; }
          [ -n "$PLIST" ] || { echo "Set GOOGLE_SERVICE_INFO_PLIST (base64)"; exit 1; }
      - name: Firebase's configuration and the API key
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          echo "$PLIST" | base64 --decode > ios/iosApp/StreetGym/GoogleService-Info.plist
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Generate the Xcode project
        working-directory: ios/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archive, sign and upload
        working-directory: ios/iosApp
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_NATIVE_ID: ${{ vars.ADMOB_NATIVE_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          REVERSED=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' StreetGym/GoogleService-Info.plist)
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild archive -project StreetGym.xcodeproj -scheme StreetGym -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/StreetGym.xcarchive" "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            ADMOB_APP_ID="$ADMOB_APP_ID" ADMOB_NATIVE_ID="$ADMOB_NATIVE_ID" ADMOB_INTERSTITIAL_ID="$ADMOB_INTERSTITIAL_ID" \
            GOOGLE_REVERSED_CLIENT_ID="$REVERSED"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/StreetGym.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ios/iosApp/StreetGym/GoogleService-Info.plist
