org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
android.useAndroidX=true
# Optimized resource shrinking (R8 also removes resources only unused code reached); Play recommends it (2026-11-02).
android.r8.optimizedResourceShrinking=true
# AGP 9 makes R8 keep rules strict: a kept class no longer keeps its default constructor. Libraries built for the old
# rules then crash at launch (WorkManager's Room database, via the Google ads SDK, 2026-11-02), so keep the old meaning.
android.r8.strictFullModeForKeepRules=false
kotlin.code.style=official

# Street Gym's own AdMob app (since 2.7.0); release never falls back to other IDs. Debug builds always use Google demo IDs.
admob.streetgymnastics.appId=ca-app-pub-4395899315978493~1217560851
admob.streetgymnastics.nativeId=ca-app-pub-4395899315978493/7347854934
admob.streetgymnastics.interstitialId=ca-app-pub-4395899315978493/3408609929
