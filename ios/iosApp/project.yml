# The Xcode project, generated by XcodeGen on a Mac (`xcodegen generate` in this folder). Never edit the .xcodeproj:
# it is not in git. Everything the project needs is written here.
name: StreetGym
options:
  bundleIdPrefix: com.justdataplease
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
# The Parks map: MapLibre Native for iOS, as Android's MapLibre (6.x; checked 18 Nov 2026: 6.31.0 is the latest 6.x).
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
settings:
  base:
    # Versions start at 1.0; CI passes the build number (CURRENT_PROJECT_VERSION) for TestFlight.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  StreetGym:
    type: application
    platform: iOS
    sources:
      - path: StreetGym
    dependencies:
      - package: MapLibre
        product: MapLibre
    info:
      path: StreetGym/Info.plist
      properties:
        CFBundleDisplayName: Street Gym
        # Parks near me, in Android's words (parks_teaser, parks_credit); asked only when the athlete wants parks near
        # them, approximate by default, as Android asks only for the coarse location.
        NSLocationWhenInUseUsageDescription: To show the outdoor workout parks nearest you. Your location isn’t sent anywhere.
        NSLocationDefaultAccuracyReduced: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Compose draws at the screen's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        # Only HTTPS and Apple's own encryption: no export paperwork.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdataplease.streetgym
        PRODUCT_NAME: Street Gym
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The screens and the engine: the Kotlin framework Gradle builds in the script below.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # The Kotlin framework is static, so the system frameworks its sounds, alerts and location use are linked here.
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - StreetGymApp
          - -framework
          - AudioToolbox
          - -framework
          - UserNotifications
          - -framework
          - CoreLocation
        # The script runs Gradle, which reads and writes outside Xcode's sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          sh ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
  # Opens the app in the Simulator and saves a picture of each screen, which CI uploads for review.
  StreetGymTour:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StreetGymTour
    dependencies:
      - target: StreetGym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdataplease.streetgym.tour
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: StreetGym
schemes:
  StreetGym:
    build:
      targets:
        StreetGym: all
        StreetGymTour: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StreetGymTour
    archive:
      config: Release
