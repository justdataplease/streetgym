# The Xcode project, generated by XcodeGen on a Mac (`xcodegen generate` in this folder). Never edit the .xcodeproj:
# it is not in git. Everything the project needs is written here.
name: StreetGym
options:
  bundleIdPrefix: com.justdataplease
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
# The Parks map: MapLibre Native for iOS, as Android's MapLibre (6.x; checked 18 Nov 2026: 6.31.0 is the latest 6.x).
# Free's ads: the Google Mobile Ads SDK and Google's consent (User Messaging Platform), checked 18 Nov 2026: 13.13.0
# (16 Nov 2026; 13.4.0 and later need Xcode 26.2 or newer) and 3.1.0 (the package of ads asks for UMP below 4.0).
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0
# The StoreKit test file the scheme's Run uses: Android's products at Android's prices, bought in the Simulator without
# an Apple account. Kept in the project but out of the app's bundle.
fileGroups:
  - Products.storekit
settings:
  base:
    # Versions start at 1.0; CI passes the build number (CURRENT_PROJECT_VERSION) for TestFlight.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # AdMob: Google's published test app and units (https://developers.google.com/admob/ios/test-ads). The owner's own
    # are passed as these build settings when they exist (for example on xcodebuild's command line); never written here.
    ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
    ADMOB_NATIVE_ID: ca-app-pub-3940256099942544/3986624511
    ADMOB_INTERSTITIAL_ID: ca-app-pub-3940256099942544/4411468910
targets:
  StreetGym:
    type: application
    platform: iOS
    sources:
      - path: StreetGym
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
    info:
      path: StreetGym/Info.plist
      properties:
        CFBundleDisplayName: Street Gym
        # Parks near me, in Android's words (parks_teaser, parks_credit); asked only when the athlete wants parks near
        # them, approximate by default, as Android asks only for the coarse location.
        NSLocationWhenInUseUsageDescription: To show the outdoor workout parks nearest you. Your location isn’t sent anywhere.
        NSLocationDefaultAccuracyReduced: true
        # Free's ads (GoogleAds.swift): the AdMob app and units from the build settings above, Apple's tracking
        # question, and the ad networks Google lists for SKAdNetwork (https://developers.google.com/admob/ios/quick-start).
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        StreetGymNativeAdUnit: $(ADMOB_NATIVE_ID)
        StreetGymInterstitialAdUnit: $(ADMOB_INTERSTITIAL_ID)
        NSUserTrackingUsageDescription: Free shows ads. Allowing this lets them match what you like; Street Gym works the same either way.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Compose draws at the screen's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        # Only HTTPS and Apple's own encryption: no export paperwork.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdataplease.streetgym
        PRODUCT_NAME: Street Gym
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The screens and the engine: the Kotlin framework Gradle builds in the script below.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # The Kotlin framework is static, so the system frameworks its sounds, alerts and location use are linked here.
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - StreetGymApp
          - -framework
          - AudioToolbox
          - -framework
          - UserNotifications
          - -framework
          - CoreLocation
        # The script runs Gradle, which reads and writes outside Xcode's sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          sh ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
  # Opens the app in the Simulator and saves a picture of each screen, which CI uploads for review.
  StreetGymTour:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StreetGymTour
    dependencies:
      - target: StreetGym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdataplease.streetgym.tour
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: StreetGym
schemes:
  StreetGym:
    build:
      targets:
        StreetGym: all
        StreetGymTour: [test]
    run:
      config: Debug
      # Plus and Pro bought in the Simulator from the StoreKit file, without an Apple account. xcodebuild's test runs
      # don't take it (Apple's FB22237318), so the tour opens the offers but buys nothing.
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      targets:
        - StreetGymTour
    archive:
      config: Release
